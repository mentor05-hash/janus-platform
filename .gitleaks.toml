# janus-platform gitleaks 설정 — 실행계획서 §1-2·§1-3 강제 장치
# 기본 시크릿 룰 전체 상속 + 야누스 금지 파일명 패턴(저작권 데이터·티어 산출물·PII) 추가.
# 훅: .githooks/pre-commit (활성화: bash scripts/setup-hooks.sh)

[extend]
useDefault = true

# ── §1-2 금지 파일명: 저작권 데이터 원본·파생 (private repo도 불가) ──

[[rules]]
id = "janus-forbidden-adiga"
description = "어디가(adiga) 데이터 파일 — repo 반입 금지 (janus-data 로컬 전용)"
path = '''(^|/)adiga_[^/]*\.json$'''

[[rules]]
id = "janus-forbidden-esteacher"
description = "esteacher 데이터 파일 — repo 반입 금지 (janus-data 로컬 전용)"
path = '''(^|/)esteacher_[^/]*\.json$'''

[[rules]]
id = "janus-forbidden-gosok"
description = "고속 데이터 파일 — repo 반입 금지 (janus-data 로컬 전용)"
path = '''(^|/)고속_[^/]*\.json$'''

[[rules]]
id = "janus-forbidden-calib"
description = "보정 calib 데이터 파일 — repo 반입 금지 (janus-data 로컬 전용)"
path = '''(^|/)보정_calib_[^/]*\.json$'''

[[rules]]
id = "janus-forbidden-admission-data"
description = "수시 admission-data.json — repo 반입 금지 (janus-data 로컬 전용)"
path = '''(^|/)admission-data\.json$'''

[[rules]]
id = "janus-forbidden-internal"
description = "파일명에 INTERNAL 포함 — 내부 전용 산출물 반입 금지"
path = '''(^|/)[^/]*INTERNAL[^/]*$'''

# ── §1-2 티어 빌드 산출물: 회원 이상 커밋·배포 금지 (무료판만 공개) ──

[[rules]]
id = "janus-forbidden-dist-tier"
description = "dist-tier 회원 이상(member/paid/consultant) 산출물 — 커밋 금지"
path = '''(^|/)dist-tier/(member|paid|consultant)/'''

# ── §1-2 ENV·덤프 (gitignore와 이중 방어) ──

[[rules]]
id = "janus-forbidden-envfile"
description = ".env 파일 — 커밋 금지 (예시 파일 .env.example만 허용)"
path = '''(^|/)\.env(\.[^/]*)?$'''

[[rules]]
id = "janus-forbidden-db-dump"
description = "DB 덤프 파일 — 커밋 금지"
path = '''(^|/)[^/]*\.(dump|sql\.gz|pgdump)$'''

[allowlist]
description = "패턴 문자열 자체를 담는 설정·훅·문서는 파일명 룰 오탐에서 제외"
paths = [
  '''^\.gitleaks\.toml$''',
  '''^\.githooks/''',
  '''(^|/)\.env\.example$''',
]
# NestJS 보일러플레이트 README의 CircleCI 배지 플레이스홀더 — 실키 아님
regexes = ['''token=abc123def456''']
