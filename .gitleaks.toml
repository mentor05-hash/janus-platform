# gitleaks 설정 — 이 repo 에서 실제로 위험한 것만 잡고, 정당한 더미값은 예외로 둔다.
# CLAUDE.md §4: .env·API 키·JWT/HMAC 시크릿·PII·DB 덤프 커밋 금지.
# 실행: gitleaks protect --staged (pre-commit) / gitleaks detect (CI 전체 이력)

title = "janus-platform"

[extend]
useDefault = true # 기본 룰(AWS·GitHub·Slack·Stripe 등) 위에 아래 프로젝트 룰을 얹는다

[[rules]]
id = "anthropic-api-key"
description = "Anthropic(Claude) API 키 — LLM_PROVIDER=claude 자격증명"
regex = '''sk-ant-[a-zA-Z0-9_\-]{20,}'''
keywords = ["sk-ant"]

[[rules]]
id = "livekit-api-secret"
description = "LiveKit API secret — 값이 새면 강의·상담 룸 토큰을 위조할 수 있다"
regex = '''(?i)livekit_api_secret\s*[:=]\s*['"]?([a-zA-Z0-9+/=_\-]{24,})['"]?'''
keywords = ["livekit_api_secret"]

[[rules]]
id = "jwt-hmac-secret"
description = "JWT/HMAC 서명 시크릿 — 값이 새면 임의 계정으로 로그인 가능"
regex = '''(?i)(jwt_secret|jwt_refresh_secret|sso_hmac_secret|room_token_secret)\s*[:=]\s*['"]?([^\s'"#]{12,})['"]?'''
keywords = ["jwt_secret", "jwt_refresh_secret", "sso_hmac_secret", "room_token_secret"]

[[rules]]
id = "toss-payments-key"
description = "토스페이먼츠 시크릿 키(W9~10 실연동 예정)"
regex = '''(test|live)_sk_[a-zA-Z0-9]{20,}'''
keywords = ["_sk_"]

[[rules]]
id = "postgres-url-with-password"
description = "비밀번호가 박힌 DB 접속 문자열"
regex = '''postgres(ql)?://[^:@\s]+:[^@\s]{6,}@[^\s/'"]+'''
keywords = ["postgres://", "postgresql://"]

[[rules]]
id = "private-key-block"
description = "PEM 사설키"
regex = '''-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY( BLOCK)?-----'''
keywords = ["BEGIN", "PRIVATE KEY"]

[allowlist]
description = "정당한 더미·데모값. 예외는 최소 범위로 — 실키를 통과시키지 않게 값 자체를 특정한다."

# 로컬·CI 고정 더미값(실서버에서는 ENV 로 주입). 값을 그대로 나열해 다른 값은 계속 탐지된다.
regexes = [
  '''ci_test_secret''',
  '''ci_test_refresh_secret''',
  '''itall_local_pw''',
  '''postgres(ql)?://itall:itall_local_pw@''',
  '''postgres(ql)?://(user|username|USER):(pass|password|PASSWORD|비밀번호)@''', # 문서의 자리표시자
  '''REPLACE''',                                                                # branding.config.json 자리표시자
  '''sk-ant-(xxx|api03-xxx|your|YOUR)''',                                       # 문서 예시
]

# 잠금파일·바이너리·빌드 산출물은 스캔 제외(오탐만 만든다)
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)dist-tier/''',
  '''(^|/)\.next/''',
  '''\.(png|jpe?g|gif|webp|ico|pdf|zip|mp4|woff2?)$''',
  '''(^|/)\.gitleaks\.toml$''', # 이 파일의 룰 정규식 자체가 걸리지 않게

  # 데모 계정·터널 URL 이 평문으로 적힌 안내 문서 3종. private repo + 더미 데이터라 지금은
  # 통제되지만 공개 전 정리 대상이다(백로그 B021 — W9 프로덕션 게이트). 스캐너가 매번
  # 실패하지 않게 예외로 두되, 목록을 남겨 잊지 않도록 한다.
  '''(^|/)DEPLOY\.md$''',
  '''(^|/)docs/접속_주소_정리\.md$''',
  '''(^|/)시뮬레이션_계정_안내\.md$''',
]
