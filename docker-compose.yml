# 멘토링 플랫폼 — 로컬 개발 인프라 (Phase 0)
# 클라우드 이식 시: 이 compose 대신 관리형 PostgreSQL/Redis로 교체(코드 변경 없음).
services:
  postgres:
    image: postgres:16-alpine
    container_name: janus_pg
    environment:
      POSTGRES_USER: janus
      POSTGRES_PASSWORD: janus_local_pw   # 로컬 전용. prod는 시크릿 매니저
      POSTGRES_DB: janus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janus -d janus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: janus_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
