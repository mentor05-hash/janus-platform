name: CI

# CLAUDE.md §10 — CI 에서 빌드/검증. 컨테이너 이미지·배포는 클라우드 대상 확정 후(배포 전환).
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-unit:
    name: Lint · Build · Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Migration 순번 검사(갭·중복)
        run: npm run migrate:check
      - name: Lint (비차단 — 빌드/tsc 가 게이트)
        run: npx eslint "src/**/*.ts"
        continue-on-error: true
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  e2e:
    name: E2E (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: janus_local_pw
          POSTGRES_DB: janus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janus -d janus"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://janus:janus_local_pw@localhost:5432/janus
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret
      JWT_REFRESH_SECRET: ci_test_refresh_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Apply migrations (fresh DB)
        run: npm run migrate:all
      - name: Seed
        run: npm run seed
      - name: E2E tests
        run: npm run test:e2e

  smoke-e2e:
    name: Smoke E2E (ops curl 스크립트)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: janus_local_pw
          POSTGRES_DB: janus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janus -d janus"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://janus:janus_local_pw@localhost:5432/janus
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret
      JWT_REFRESH_SECRET: ci_test_refresh_secret
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Apply migrations (fresh DB)
        run: npm run migrate:all
      - name: Seed (base 계정)
        run: npm run seed
      - name: Build
        run: npm run build
      - name: Start API (background)
        # 스모크 스위트는 짧은 시간에 로그인 25회 → 로그인 상한(10회/분)에 걸린다.
        # ops/run-all-e2e.sh 가 요구하는 조건이다. 이 잡 안에서만 유효하며 배포에는 절대 설정하지 않는다.
        env:
          RATE_LIMIT_DISABLED: 'true'
        run: |
          node dist/main &
          echo $! > /tmp/api.pid
      - name: Run ops smoke E2E
        run: bash ../../ops/run-all-e2e.sh
        env:
          API: http://localhost:3000/api/v1
      - name: Stop API
        if: always()
        run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true

  web:
    name: Web (typecheck · unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
