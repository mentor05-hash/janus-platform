name: CI

# CLAUDE.md §10 — CI 에서 빌드/검증. 컨테이너 이미지·배포는 클라우드 대상 확정 후(배포 전환).
on:
  push:
    # ⚠ 실제 기본 브랜치를 반드시 포함할 것. `[main, master]` 만 있던 동안
    #    기본 브랜치(feat/consulting-intake)로의 **직접 push 는 CI 가 아예 돌지 않았다** —
    #    PR 을 거치지 않고 들어온 변경은 검증 없이 통과했다는 뜻이다.
    #    기본 브랜치가 바뀌면 여기도 함께 바꿔야 한다.
    branches: [feat/consulting-intake, main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 실수 유입 방지 ──────────────────────────────────────────────
  # 실험·서브 계획으로 하던 작업이 기본 브랜치에 들어가는 경로는 둘이다:
  #   ① 미완성 PR 을 그대로 머지  ② PR 을 거치지 않고 직접 push
  # 아래 두 잡이 각각을 담당한다. **물리적 차단은 브랜치 보호 규칙의 몫**이고,
  # 이 잡들은 그 규칙이 필수 상태 검사로 지정할 대상이다(규칙 없이는 빨간불까지만).
  merge-readiness:
    name: 머지 준비 확인 (미완성 표식)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 미완성 표식 검사
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          fail=0
          # 제목의 미완성 표식 — 머지할 의사가 생기면 저자가 직접 지운다(명시적 행위).
          #
          # ⚠ 한글 표식은 **대괄호 형태만** 본다. `초안`·`실험` 은 이 제품의 일상 어휘라
          #    맨문자로 잡으면 "AI 초안 한도 추가" 같은 정상 PR 이 막힌다(실측 확인).
          #    표식은 우연히 들어갈 수 없는 모양이어야 한다.
          if printf '%s' "$TITLE" | grep -qiE '(\[wip\]|^wip[: ]|\bdo not merge\b|\[머지금지\]|\[미완성\]|\[실험\]|\[초안\])'; then
            echo "::error::PR 제목에 미완성 표식이 있습니다: $TITLE"
            echo "  → 머지할 준비가 되면 표식을 지우세요. 이 검사는 '실수로 머지'를 막기 위한 것입니다."
            fail=1
          fi
          # 실험용 브랜치 접두사 — 서브 계획은 exp/·wip/·spike/ 로 두고 기본 브랜치로 보내지 않는다.
          if printf '%s' "$HEAD_REF" | grep -qE '^(exp|wip|spike|tmp)/'; then
            echo "::error::실험용 브랜치입니다: $HEAD_REF"
            echo "  → 정식으로 넣을 작업이면 브랜치를 옮기세요(예: claude/…·feat/…)."
            fail=1
          fi
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::error::Draft PR 입니다 — 준비되면 'Ready for review' 로 전환하세요."
            fail=1
          fi
          [ "$fail" = 0 ] && echo "✓ 미완성 표식 없음"
          exit $fail

  direct-push-guard:
    name: 직접 push 감지 (기본 브랜치)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: PR 을 거쳤는지 확인
        run: |
          # PR 머지는 부모가 2개(머지 커밋)이거나 제목에 (#N) 이 붙는다(squash).
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          msg=$(git log -1 --pretty=%s)
          if [ "$parents" -ge 3 ] || printf '%s' "$msg" | grep -qE '\(#[0-9]+\)'; then
            echo "✓ PR 경유 확인: $msg"
            exit 0
          fi
          echo "::error::PR 을 거치지 않은 직접 push 로 보입니다: $msg"
          echo "  기본 브랜치에는 PR 로만 들어와야 합니다 — 실험·서브 계획 작업이"
          echo "  검증 없이 섞이는 것을 막기 위해서입니다."
          echo "  이 커밋이 의도한 것이라면 무시해도 되지만, 아니라면 지금 되돌리세요."
          exit 1

  lint-build-unit:
    name: Lint · Build · Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Migration 순번 검사(갭·중복)
        run: npm run migrate:check
      # 포맷은 기계가 전부 고칠 수 있으므로 부채로 남기지 않는다 — 0 을 강제한다.
      - name: 포맷 검사 (prettier)
        run: npm run format:check
      # 남은 린트 오류는 타입을 붙여야 사라지는 부채라 한 번에 0 이 될 수 없다.
      # 총량 상한을 두어 **늘어나지 못하게**만 한다(scripts/lint-budget.mjs 주석 참조).
      # 이전에는 continue-on-error 라 실패해도 초록이었고, 그 사이 3,391건까지 쌓였다.
      - name: 린트 예산 검사
        run: npm run lint:budget
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  e2e:
    name: E2E (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: janus_local_pw
          POSTGRES_DB: janus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janus -d janus"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://janus:janus_local_pw@localhost:5432/janus
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret
      JWT_REFRESH_SECRET: ci_test_refresh_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Apply migrations (fresh DB)
        run: npm run migrate:all
      - name: Seed
        run: npm run seed
      - name: E2E tests
        run: npm run test:e2e

  smoke-e2e:
    name: Smoke E2E (ops curl 스크립트)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: janus_local_pw
          POSTGRES_DB: janus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janus -d janus"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://janus:janus_local_pw@localhost:5432/janus
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret
      JWT_REFRESH_SECRET: ci_test_refresh_secret
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Apply migrations (fresh DB)
        run: npm run migrate:all
      - name: Seed (base 계정)
        run: npm run seed
      - name: Build
        run: npm run build
      - name: Start API (background)
        # 스모크 스위트는 짧은 시간에 로그인 25회 → 로그인 상한(10회/분)에 걸린다.
        # ops/run-all-e2e.sh 가 요구하는 조건이다. 이 잡 안에서만 유효하며 배포에는 절대 설정하지 않는다.
        env:
          RATE_LIMIT_DISABLED: 'true'
        run: |
          node dist/main &
          echo $! > /tmp/api.pid
      - name: Run ops smoke E2E
        run: bash ../../ops/run-all-e2e.sh
        env:
          API: http://localhost:3000/api/v1
      - name: Stop API
        if: always()
        run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true

  web:
    name: Web (typecheck · unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  mobile:
    name: Mobile (typecheck · expo export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Typecheck
        run: npm run typecheck
      # 왜 export 까지 하나: `tsc` 는 **웹 빌드에서만 드러나는 결함**을 못 잡는다.
      # O123 이 그 예다 — `react-native-web` 의 Alert 가 빈 함수라 안내 22곳이 무음이었는데
      # 타입은 멀쩡했다. metro 번들이 실제로 만들어지는지까지 확인해야 의미가 있다.
      #
      # ⚠ 이 잡이 없던 동안 모바일 변경은 **로컬 실측이 유일한 증빙**이었다(O185 재편 3커밋).
      #   CI 는 모바일이 깨져도 초록이었다.
      - name: Expo web export (번들 생성 확인)
        run: npm run export:web
        env:
          # export 스크립트가 읽는 값 — 실제 서빙은 nginx 프록시 뒤 상대경로다.
          EXPO_PUBLIC_API_BASE: /api/v1
          EXPO_PUBLIC_DEMO_MODE: 'false'

  images:
    name: 이미지 빌드 (web · api · mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # 왜 이 잡이 필요한가: 나머지 잡은 전부 **호스트에서** npm ci 를 돌린다. 호스트에는 모든
      # 워크스페이스가 한 트리에 설치되므로, 어떤 패키지가 자기가 선언하지 않은 것에
      # **호이스팅으로 얹혀 있어도** 통과한다. 이미지는 워크스페이스를 쪼개 필요한 것만 COPY 하므로
      # 그 우연한 결합이 그때서야 드러난다 — 즉 CI 는 초록인데 배포가 불가능한 상태가 된다.
      #
      # 실제로 2026-07-31 에 그 상태였고 다섯 군데가 한꺼번에 나왔다:
      #   ① Dockerfile 워크스페이스 COPY 에 packages/nav 누락 → npm 이 레지스트리에서 찾다 404
      #   ② 워크스페이스 prepare 가 소스 COPY 전에 tsc 실행 → TS5058
      #   ③ web 테스트가 api 의 @types/node 에 얹힘 → TS2307
      #   ④⑤ 순수 도메인 패키지가 web 의 @types/react 에 얹힘 → TS2688
      # 다섯 건 모두 이 잡이 있었으면 PR 단계에서 잡혔다.

      # 모바일 이미지는 Dockerfile 이 `apps/mobile/dist`(expo export 산출물)를 전제한다.
      # 그래서 이미지 빌드 전에 여기서 한 번 만든다 — 이 단계가 없으면 clean checkout 에서
      # 모바일 이미지는 아예 빌드되지 않는다(로컬에 dist 가 남아 있으면 통과해 보인다).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Expo web export (모바일 이미지 입력)
        run: npm run export:web
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_BASE: /api/v1
          EXPO_PUBLIC_DEMO_MODE: 'false'

      # 빌드 컨텍스트는 모노레포 루트다(각 Dockerfile 주석 참조). push 는 하지 않는다 —
      # 레지스트리가 정해지기 전까지는 "빌드가 되는가"만 검증한다.
      - name: web 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: api 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: mobile 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mobile/Dockerfile
          push: false
          cache-from: type=gha,scope=mobile
          cache-to: type=gha,scope=mobile,mode=max
