name: CI

# CLAUDE.md §10 — CI 에서 빌드/검증. 컨테이너 이미지·배포는 클라우드 대상 확정 후(배포 전환).
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 시크릿 유출 최종 방어선 — pre-commit 훅(.githooks)은 로컬이라 우회 가능하므로 CI 에서 강제 차단.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 이력 스캔 — 과거 커밋에 묻힌 키까지
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  lint-build-unit:
    name: Lint · Build · Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npm run prisma:generate
      # 차단 게이트(2026-07-26 승격). 1509건 → error 0 / warn 133 으로 정리 후 올렸다.
      # --max-warnings 는 남은 부채의 **상한**이다: 새 위반이 생기면 CI 가 실패하고,
      # 부채는 줄어드는 방향으로만 움직인다. 정리해서 숫자가 내려가면 이 값도 함께 낮춘다.
      - name: Lint (차단 — error 0 + 경고 상한 133)
        run: npx eslint "src/**/*.ts" --max-warnings=133
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  e2e:
    name: E2E (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itall
          POSTGRES_PASSWORD: itall_local_pw
          POSTGRES_DB: itall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itall -d itall"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://itall:itall_local_pw@localhost:5432/itall
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret
      JWT_REFRESH_SECRET: ci_test_refresh_secret
      # 사용자별 AI 한도(B221 1층)는 **제품 정책값**이다. 테스트가 그 숫자에 의존하면
      # 정책을 조정할 때 무관한 e2e 가 깨진다 — 테스트에서는 충분히 크게 열어 분리한다.
      LLM_REPORT_REVIEW_PER_USER_DAY: '10000'
      LLM_SIMILARITY_PER_USER_DAY: '10000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Apply migrations (fresh DB)
        run: npm run migrate:all
      - name: Seed
        run: npm run seed
      - name: E2E tests
        run: npm run test:e2e

  web:
    name: Web (typecheck · unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      # expo export(웹 번들)는 시간·용량이 커 CI 에서 돌리지 않는다 — 타입만 게이트.
      - name: Typecheck
        run: npm run typecheck

  rooms:
    name: Realtime rooms (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/realtime-rooms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      # 이 앱에는 typecheck 스크립트가 없다 — nest build 가 tsc 를 태우므로 그것을 게이트로 쓴다.
      - name: Build
        run: npm run build
