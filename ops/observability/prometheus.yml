# Prometheus 스크레이프 설정 — janus API/rooms 의 노출된 /metrics 수집.
# docker-compose.observability.yml 로 기동(메인 compose 네트워크에 조인).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: janus-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api:3000']
        labels: { service: api }

  - job_name: janus-rooms
    metrics_path: /api/rt/v1/metrics
    static_configs:
      - targets: ['realtime-rooms:3100']
        labels: { service: rooms }

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
