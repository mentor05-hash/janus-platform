# 잇올 멘토링 — 전체 스택 설치형(api + web + db + redis) · 기능 연동 검증/배포용.
#
# 실행(개발 인프라와 같은 5432/6379 사용 → 먼저 dev 인프라를 내려야 함):
#   docker compose down                              # 기존 dev postgres/redis 중지(볼륨 보존)
#   docker compose -f docker-compose.full.yml up --build
#   → http://localhost:8080   (웹. nginx 가 /api 를 api 컨테이너로 프록시)
#
# 데이터: 같은 프로젝트의 'pgdata' 볼륨을 공유 → 이미 시드된 데이터(시뮬 86명) 그대로 사용.
# 전원 비밀번호: Itall-2026!(시뮬), dev-password!(기본 더미).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: itall
      POSTGRES_PASSWORD: itall_local_pw
      POSTGRES_DB: itall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # dev compose 와 동일 볼륨(시드 데이터 재사용)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itall -d itall"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # 스키마 마이그레이션(멱등) 후 기동 — 빈 DB 로 시작해도 스키마 보장.
    command: sh -c "node scripts/apply-migrations.mjs || true; node dist/main.js"
    environment:
      NODE_ENV: local
      PORT: "3000"
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://itall:itall_local_pw@postgres:5432/itall
      REDIS_URL: redis://redis:6379
      JWT_SECRET: itall-jwt-secret-please-change
      JWT_REFRESH_SECRET: itall-refresh-secret-please-change
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_TTL: "1209600"
      PG_PROVIDER: mock
      NOTIFICATION_PROVIDER: mock
      STORAGE_PROVIDER: local
      ZOOM_PROVIDER: mock
      LLM_PROVIDER: none
      HOMEROOM_CYCLE_DAYS: "30"
      PRE_BOOK_HORIZON_DAYS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  # 학생·학부모용 모바일(expo-web 정적). 사전 빌드된 apps/mobile/dist 를 nginx 로 서빙.
  #   빌드 전: cd apps/mobile && EXPO_PUBLIC_API_BASE=/api/v1 npx expo export -p web
  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile.web
    ports:
      - "8090:80"
    depends_on:
      - api

volumes:
  pgdata:   # = itall-mentoring_pgdata (dev compose 와 공유)
